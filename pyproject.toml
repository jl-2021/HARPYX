[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harpyx"
version = "0.1.0"
description = "xarray integration for HARPY HAR files"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPLv3" }
authors = [{ name = "James Lennox", email = "james.lennox@vu.edu.au" }]
keywords = ["har", "harpy", "xarray", "cge", "computable-general-equilibrium"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "xarray>=0.16.0",
    "numpy>=1.18.0",
    "harpy3 @ git+https://github.com/GEMPACKsoftware/HARPY.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["harpyx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "unit: Unit tests for individual functions",
    "integration: Integration tests with full workflows",
    "roundtrip: Round-trip read/write tests",
    "slow: Tests that take significant time",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
